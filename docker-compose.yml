

services:
 # PHP 8.3 + Apache Application Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APA_DOC_ROOT: /var/www/html
    volumes:
      - ./src:/var/www/html/src
    ports:
      - "8082:80"
    depends_on:
      - db
      - reverb
    networks:
      - dts-network

  # MySQL 8.0 Database Server Engine
  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: testdb
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - dts-network

  # phpMyAdmin Web Database Interface
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    depends_on:
      - db
    networks:
      - dts-network

  # Laravel Reverb WebSocket Server (local development only)
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    command: php src/artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./src:/var/www/html/src
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - dts-network

  # Laravel Scheduler — runs `php artisan schedule:run` every 60 seconds so
  # time-based checks (dts:check-overdue, dts:check-near-overdue) actually fire.
  # Depends only on db: nothing depends on scheduler, and scheduler does not
  # depend on app or reverb, so no circular dependency is possible.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "while true; do php src/artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./src:/var/www/html/src
    depends_on:
      - db
    networks:
      - dts-network

networks:
  dts-network:
    driver: bridge

volumes:
  mysql-data:
