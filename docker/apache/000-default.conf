<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html/src/public

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	# Reverb same-origin reverse proxy.
	#
	# Browsers connect to <page-origin>/app/<key> (same host/port/scheme as
	# the page itself, so this works through single-origin proxies and
	# tunnels that only forward the app origin). Apache forwards those
	# requests to the reverb service over the internal Docker network,
	# where Reverb listens on 0.0.0.0:8080.
	#
	# /broadcasting/auth is intentionally NOT proxied: it is served
	# directly by Laravel (already same-origin) and needs the app's
	# session/cookies, not the WebSocket server.
	ProxyRequests Off
	ProxyPreserveHost Off

	RewriteEngine On
	RewriteCond %{HTTP:Upgrade} websocket [NC]
	RewriteRule ^/app/(.*) ws://reverb:8080/app/$1 [P,L]

	ProxyPass /app/ http://reverb:8080/app/
	ProxyPassReverse /app/ http://reverb:8080/app/
</VirtualHost>
